name: Portfolio checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate-static-site:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Validate JavaScript syntax
        run: node --check public/app.js
      - name: Validate required portfolio files
        run: test -s public/index.html && test -s public/styles.css && test -s public/app.js && test -s amplify.yml
