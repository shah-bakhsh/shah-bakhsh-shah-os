name: SHAH.OS quality checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  nextjs-quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm install
      - name: TypeScript check
        run: npm run typecheck
      - name: ESLint
        run: npm run lint
      - name: Build static Next.js export
        run: npm run build
